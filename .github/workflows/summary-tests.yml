name: Crossover summary checks
on:
  push:
  pull_request:
jobs:
  summary-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check summary arithmetic and fixture behavior
        run: python -m unittest discover -s tests -v
